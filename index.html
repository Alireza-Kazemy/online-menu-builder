<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>کافه ارغوان</title>
  <meta name="description"
    content="منوی دیجیتال کافه ارغوان با الهام از اصالت فرش لاکی و هنر سنتی ایرانی در قالبی مدرن و شیشه‌ای، دوزبانه">
  <meta name="theme-color" content="#7A0C16">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Persian Carpet Subtle Background Texture & Ambient Glow -->
  <div class="carpet-pattern-overlay"></div>
  <div class="toranj-glow"></div>

  <div class="app-container">

    <!-- Top Sticky Bar (فقط سوییچ زبان و برند، بدون هیچ دکمه ادمینی) -->
    <header class="top-nav" id="topNav">
      <div class="brand-minimal">
        <div>
          <div class="brand-title display-title" id="brandTitle">کافه ارغوان</div>
          <div class="brand-subtitle" id="brandSubtitle">طعم اصیل ایرانی در قالبی نوین</div>
        </div>
      </div>

      <div class="nav-actions">
        <!-- Bilingual Switcher -->
        <button class="btn-glass lang-toggle-btn" id="langToggleBtn" title="تغییر زبان / Switch Language">
          English
        </button>
      </div>
    </header>

    <!-- Hero Showcase Section -->
    <section class="hero-section">
      <div class="hero-carpet-border"></div>

      <h1 class="hero-title display-title" id="heroTitle">کافه ارغوان</h1>
      <p class="hero-desc" id="heroDesc">

          <span id="heroInstagramText">اینستاگرام: arghavansaray@</span>
        </a>
      </div>
    </section>

    <!-- Search Input Bar -->
    <div class="search-container">
      <div class="search-input-wrapper">
        <svg viewBox="0 0 24 24">
          <path
            d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />

        <input type="text" id="searchInput" class="search-input" placeholder="جستجوی نوشیدنی، غذا، دسر..."

        <button class="search-clear-btn" id="searchClearBtn" title="پاک کردن جستجو">✕</button>
      </div>
    </div>

    <!-- Sticky Horizontal Category Navigation (Smooth scroll to section) -->

      <div class="categories-scroll" id="categoriesScroll">
        <div class="skeleton-shimmer skeleton-category-pill"></div>
        <div class="skeleton-shimmer skeleton-category-pill"></div>
        <div class="skeleton-shimmer skeleton-category-pill"></div>
        <div class="skeleton-shimmer skeleton-category-pill"></div>

    </div>

        </div>
        <div class="items-grid">
          <div class="menu-card skeleton-card">
            <div class="card-img-wrapper skeleton-shimmer skeleton-img"></div>
            <div class="card-content">
              <div class="skeleton-shimmer skeleton-title skeleton-line"></div>
              <div class="skeleton-shimmer skeleton-subtitle skeleton-line"></div>
              <div class="skeleton-shimmer skeleton-desc skeleton-line"></div>
              <div class="skeleton-shimmer skeleton-price"></div>
            </div>
          </div>
          <div class="menu-card skeleton-card">
            <div class="card-img-wrapper skeleton-shimmer skeleton-img"></div>
            <div class="card-content">
              <div class="skeleton-shimmer skeleton-title skeleton-line"></div>
              <div class="skeleton-shimmer skeleton-subtitle skeleton-line"></div>
              <div class="skeleton-shimmer skeleton-desc skeleton-line"></div>
              <div class="skeleton-shimmer skeleton-price"></div>
            </div>
          </div>
          <div class="menu-card skeleton-card">
            <div class="card-img-wrapper skeleton-shimmer skeleton-img"></div>
            <div class="card-content">
              <div class="skeleton-shimmer skeleton-title skeleton-line"></div>
              <div class="skeleton-shimmer skeleton-subtitle skeleton-line"></div>
              <div class="skeleton-shimmer skeleton-desc skeleton-line"></div>
              <div class="skeleton-shimmer skeleton-price"></div>
            </div>
          </div>
          <div class="menu-card skeleton-card">
            <div class="card-img-wrapper skeleton-shimmer skeleton-img"></div>
            <div class="card-content">
              <div class="skeleton-shimmer skeleton-title skeleton-line"></div>
              <div class="skeleton-shimmer skeleton-subtitle skeleton-line"></div>
              <div class="skeleton-shimmer skeleton-desc skeleton-line"></div>
              <div class="skeleton-shimmer skeleton-price"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer Information -->

      <div class="footer-logo display-title">کافه ارغوان</div>
      <p class="footer-info" id="footerNote">لذت طعم اصیل ایرانی در کنار حال خوب</p>
      <div class="footer-links">
        <a href="https://maps.app.goo.gl/wM8R81JvMeoYVUBDA?g_st=ac" target="_blank" rel="noopener noreferrer"
          class="info-pill location-pill" style="text-decoration: none;" id="footerLocationBtn">
